<text x="45" y="94" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#C0462B">1</text>
<text x="45" y="108" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#2E2823">Library</text>
</svg>
