<title>Library development card</title>
<rect x="4" y="4" width="82" height="122" rx="9" fill="#F4EDE0" stroke="#2E2823" stroke-width="2.6"/>
<rect x="11" y="11" width="68" height="108" rx="6" fill="#8E7CB0" fill-opacity="0.35" stroke="#2E2823" stroke-width="1.2" opacity="0.7"/>
<!-- a shelf of books, one pulled out and leaning -->
<rect x="24" y="34" width="9" height="38" rx="2" fill="none" stroke="#2E2823" stroke-width="2.2"/>
<rect x="35" y="34" width="9" height="38" rx="2" fill="#C0462B" fill-opacity="0.5" stroke="#2E2823" stroke-width="2.2"/>
