<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Paper texture">
<title>Paper texture</title>
<defs>
<filter id="grain" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="7" result="n"/>
<feColorMatrix in="n" type="saturate" values="0"/>
<feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
</filter>
<filter id="fibers" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.012 0.5" numOctaves="3" seed="3" result="f"/>
<feColorMatrix in="f" type="saturate" values="0"/>
<feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
</filter>
</defs>
<rect width="400" height="400" fill="#F4EDE0"/>
<rect width="400" height="400" filter="url(#fibers)"/>
<rect width="400" height="400" filter="url(#grain)"/>
</svg>
