<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akash Sarode</title>
<style>
:root {
  --tw: 140px;          /* tile width  */
  --th: 161.66px;       /* tile height = tw * 1.1547 */
  --hstep: 140px;       /* horizontal step within a row */
  --vstep: 121.24px;    /* vertical step between rows = th * 0.75 */
  --ink: #2E2823;
  --paper: #F4EDE0;
  --player: #C0462B;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--paper) url("textures/paper.svg") repeat;
  color: var(--ink);
  font-family: "Caveat", "Patrick Hand", "Segoe Print", cursive, system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px 64px;
}
h1 { font-size: 2.4rem; margin: 8px 0 0; }
.tagline { margin: 2px 0 20px; opacity: .7; font-size: 1.1rem; }

/* ---------------------------------------------------------------- the board */
.stage { position: relative; padding: 48px; }
.board {
  position: relative;
  width: calc(5 * var(--hstep));
  height: calc(4 * var(--vstep) + var(--th));
}
.tile {
  position: absolute;
  width: var(--tw);
  height: var(--th);
  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  overflow: hidden;
  border: 0;
  padding: 0;
  background: none;
}
.tile img { width: 106%; height: 106%; margin: -3%; display: block; }
.tile.filler { cursor: default; }
.tile.content { cursor: pointer; }
.tile.content:hover img, .tile.content:focus-visible img { filter: brightness(1.06); }
.tile.content:focus-visible { outline: 3px solid var(--player); outline-offset: -3px; }

.token {
  position: absolute;
  width: 46px; height: 46px;
  pointer-events: none;
  transform: translate(-50%, -50%);
  z-index: 3;
}
.robber { position: absolute; width: 34px; transform: translate(-50%, -60%); z-index: 4; pointer-events: none; }

/* road overlay */
.road-layer { position: absolute; inset: 0; overflow: visible; z-index: 5; }
.road-seg { stroke: var(--player); stroke-width: 9; stroke-linecap: round; fill: none; }
.road-seg.ghost { stroke-dasharray: 12 10; opacity: .45; }
.node-btn { cursor: pointer; }
.node-btn:hover circle, .node-btn:focus-visible circle { r: 13; }
.node-btn image { pointer-events: none; }

/* -------------------------------------------------------------- board chrome */
.chrome { display: flex; gap: 28px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
.bonus img { height: 84px; }
.hand { display: flex; gap: 6px; margin-top: 18px; flex-wrap: wrap; justify-content: center; }
.hand img { height: 92px; transition: transform .15s; }
.hand img:hover { transform: translateY(-10px); }
.corner {
  position: fixed; top: 14px; right: 14px; z-index: 40;
  background: var(--paper); border: 2px solid var(--ink); border-radius: 6px;
  padding: 7px 13px; text-decoration: none; color: var(--ink); font-size: 1.05rem;
}
.trade {
  position: fixed; top: 14px; left: 14px; z-index: 40;
  background: var(--paper); border: 2px solid var(--ink); border-radius: 6px;
  padding: 7px 13px; cursor: pointer; font: inherit; font-size: 1.05rem; color: var(--ink);
}

/* ------------------------------------------------------------------- modals */
dialog {
  border: 3px solid var(--ink); border-radius: 10px; padding: 0;
  max-width: 560px; width: 92vw; background: var(--paper); color: var(--ink);
}
dialog::backdrop { background: rgba(46,40,35,.55); }
.m-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 2px solid var(--ink); }
.m-head img { width: 42px; }
.m-head h2 { margin: 0; font-size: 1.7rem; flex: 1; }
.m-head button { background: none; border: 0; font-size: 1.6rem; cursor: pointer; color: var(--ink); }
.m-body { padding: 16px 20px 22px; font-family: system-ui, sans-serif; font-size: .95rem; line-height: 1.6; }
.m-body h3 { font-family: inherit; margin: 14px 0 4px; font-size: 1rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { border: 1px solid var(--ink); border-radius: 4px; padding: 2px 8px; font-size: .8rem; }

/* ------------------------------------------------------------------- mobile */
.stack { display: none; width: 100%; max-width: 420px; }
.stack button {
  display: flex; align-items: center; gap: 14px; width: 100%; margin-bottom: 10px;
  background: none; border: 2px solid var(--ink); border-radius: 8px; padding: 8px 12px;
  font: inherit; font-size: 1.3rem; color: var(--ink); cursor: pointer;
}
.stack img { width: 54px; }
@media (max-width: 780px) {
  .stage, .chrome, .hand { display: none; }
  .stack { display: block; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<a class="corner" href="Akash_Sarode.pdf">Resume (PDF)</a>
<button class="trade" onclick="openTile('contact')">Trade</button>

<h1>Akash Sarode</h1>
<p class="tagline">backend &amp; systems — settle a tile to begin</p>

<div class="stage">
  <div class="board" id="board"></div>
</div>

<div class="chrome">
  <div class="bonus"><img src="cards/bonus-longest-road.svg" alt="Longest Road"></div>
  <div class="bonus"><img src="cards/bonus-largest-army.svg" alt="Largest Army"></div>
  <div class="bonus"><img src="cards/card-dev-back.svg" alt="Development card" style="height:110px"></div>
</div>

<div class="hand" id="hand"></div>

<div class="stack" id="stack"></div>

<dialog id="modal">
  <div class="m-head">
    <img id="m-icon" alt="">
    <h2 id="m-title"></h2>
    <button onclick="modal.close()" aria-label="Close">&times;</button>
  </div>
  <div class="m-body" id="m-body"></div>
</dialog>

<script>
/* ----------------------------------------------------------------- tile data */
const ROWS = [3, 4, 5, 4, 3];
const FILLERS = ["filler-brick", "filler-wheat", "filler-wood", "filler-sheep"];

const TILES = {
  "0-0": { id: "education", token: 5, title: "Education" },
  "0-2": { id: "desert",    token: null, title: "Desert" },
  "1-3": { id: "research",  token: 6, title: "Research" },
  "2-0": { id: "resume",    token: 8, title: "Resume" },
  "2-2": { id: "about-me",  token: 8, title: "About me" },
  "3-3": { id: "projects",  token: 6, title: "Projects" },
  "4-0": { id: "skills",    token: 9, title: "Skills" },
};

const CONTENT = {
  education: { title: "Education", body: `<p><strong>Georgia Institute of Technology</strong> — BS Computer Science, expected May 2028.</p>
    <p>Threads: Intelligence, Systems &amp; Architecture. GPA 3.91/4.00.</p>
    <h3>Coursework</h3><p>Machine Learning, Data Structures &amp; Algorithms, Artificial Intelligence, Low Level Programming, Design &amp; Analysis of Algorithms, Systems &amp; Networks, Object Oriented Programming.</p>` },
  resume: { title: "Resume", body: `<p>Full resume as a PDF.</p><p><a href="Akash_Sarode.pdf">Download resume &rarr;</a></p>
    <h3>Highlights</h3><p>3.91 GPA · Intelligence + Systems &amp; Architecture · May 2028 · AWS Certified Cloud Practitioner · published at arXiv.</p>` },
  research: { title: "Research", body: `<p><strong>Urban Audio Sensing Lab</strong>, Dec 2024 – May 2026.</p>
    <p>PyTorch pedestrian classifier at 71.7% balanced accuracy using mel-spectrogram feature extraction. Generated labels by running Mask2Former across 2.9M frames.</p>
    <h3>Publication</h3><p>Audio-Based Pedestrian Detection in the Presence of Vehicular Noise — arXiv:2509.19295.</p>` },
  "about-me": { title: "About me", body: `<p>CS student at Georgia Tech working mostly on backend, infrastructure, and systems. Currently interning on the broadband team at Applied Optoelectronics; heading to Vanguard as a software engineering co-op.</p>
    <hr><h3>Beyond code</h3><p>This whole site is a Catan board because I like Catan enough to spend a weekend on the joke. Six tiles are real, the rest is scenery.</p>` },
  projects: { title: "Projects", body: `<h3>Cipher Arena</h3><p>Real-time multiplayer cryptogram app for 900+ users. WebSocket server on Node.js and Socket.IO, Elo leaderboard, JWT auth.</p>
    <h3>Gesture Control</h3><p>Computer-vision Chrome extension. TensorFlow model on 67k samples, 10 gestures, 93.7% accuracy.</p>
    <h3>SustainaView</h3><p>React Native + Gemini API app for eco-friendly room makeovers, with a two-stage AI pipeline.</p>
    <h3>Basana</h3><p>In progress — finance project built on the Basana Python library.</p>` },
  skills: { title: "Skills", body: `<h3>Languages</h3><div class="chips"><span class="chip">Python</span><span class="chip">C++</span><span class="chip">TypeScript</span><span class="chip">JavaScript</span><span class="chip">Java</span></div>
    <h3>Infrastructure</h3><div class="chips"><span class="chip">Kubernetes</span><span class="chip">Docker</span><span class="chip">AWS</span><span class="chip">GCP</span><span class="chip">Git</span></div>
    <h3>Data &amp; ML</h3><div class="chips"><span class="chip">PyTorch</span><span class="chip">LangChain</span><span class="chip">Pandas</span><span class="chip">NumPy</span></div>
    <h3>Backend</h3><div class="chips"><span class="chip">FastAPI</span><span class="chip">PostgreSQL</span><span class="chip">MongoDB</span><span class="chip">Redis</span></div>` },
  desert: { title: "Desert", body: `<p>Nothing grows here. Click it a few more times.</p>` },
  contact: { title: "Trade", body: `<p>asarode9@gatech.edu</p><p><a href="https://github.com/asarode06">GitHub</a> · <a href="https://linkedin.com/in/akashsarode/">LinkedIn</a></p>` },
};

const TIMELINE = [
  { id: "uasl",     title: "Urban Audio Sensing Lab", dates: "Dec 2024 – May 2026", piece: "settlement",
    body: "Undergraduate Research Assistant. PyTorch pedestrian classifier, Mask2Former labelling across 2.9M frames, time-series analysis in Pandas and NumPy." },
  { id: "nexus",    title: "AI Makerspace Nexus", dates: "Aug 2025 – Dec 2025", piece: "settlement",
    body: "Software Engineer. RAG study tool with FastAPI and LangChain generating quizzes from course PDFs; ChromaDB vectorisation for semantic search." },
  { id: "juno",     title: "Bits of Good: Juno", dates: "Jan 2026 – May 2026", piece: "settlement",
    body: "Software Developer. End-to-end file deletion across API gateway, S3 and Azure Blob. TypeScript gRPC SDK and React dashboard for 50+ engineers." },
  { id: "aaoi",     title: "Applied Optoelectronics", dates: "May 2026 – Aug 2026", piece: "city",
    body: "Software Engineering Intern. Redis and PostgreSQL polling engine cutting device failures ~20%. Gateway deployments on GKE across ~3k virtual devices." },
  { id: "vanguard", title: "Vanguard", dates: "Sep 2026 – Apr 2027", piece: "city",
    body: "Incoming Software Engineering Co-op, Advice and Wealth Management Technology. Fullstack and AI workflow solutions." },
  { id: "grad",     title: "Graduation", dates: "May 2028", piece: "ghost",
    body: "Not built yet." },
];

/* ------------------------------------------------------------------ geometry */
const TW = 140, TH = 161.66, VSTEP = 121.24;
const board = document.getElementById("board");
const modal = document.getElementById("modal");
let fillerIdx = 0;

ROWS.forEach((n, row) => {
  for (let i = 0; i < n; i++) {
    const key = `${row}-${i}`;
    const data = TILES[key];
    const left = (5 - n) * (TW / 2) + i * TW;
    const top = row * VSTEP;

    const el = document.createElement(data ? "button" : "div");
    el.className = "tile " + (data ? "content" : "filler");
    el.style.left = left + "px";
    el.style.top = top + "px";

    const art = data ? data.id : FILLERS[(fillerIdx++ * 3 + row) % FILLERS.length];
    el.innerHTML = `<img src="tiles/${art}.svg" alt="">`;
    if (data) {
      el.setAttribute("aria-label", data.title);
      el.onclick = () => openTile(data.id);
    } else {
      el.title = "unclaimed";
      el.dataset.filler = "1";
    }
    board.appendChild(el);

    if (data && data.token) {
      const t = document.createElement("img");
      t.className = "token";
      t.src = `tokens/token-${data.token}.svg`;
      t.alt = "";
      t.style.left = (left + TW / 2) + "px";
      t.style.top = (top + TH * 0.68) + "px";
      board.appendChild(t);
    }
  }
});

/* robber lands on a random filler tile */
const fillers = [...board.querySelectorAll('[data-filler]')];
const spot = fillers[Math.floor(Math.random() * fillers.length)];
const rob = document.createElement("img");
rob.className = "robber";
rob.src = "pieces/robber.svg";
rob.alt = "The robber";
rob.style.left = (parseFloat(spot.style.left) + TW / 2) + "px";
rob.style.top = (parseFloat(spot.style.top) + TH / 2) + "px";
board.appendChild(rob);

/* -------------------------------------------------------------- road overlay */
const R = TW / Math.sqrt(3);
const row2Top = 2 * VSTEP, row2Cy = row2Top + TH / 2;
const yLow = row2Cy - R / 2, yHigh = row2Cy - R;
const chain = [];
for (let k = 0; k <= 10; k++) {
  chain.push([k * (TW / 2), k % 2 === 0 ? yLow : yHigh]);
}

const ns = "http://www.w3.org/2000/svg";
const svg = document.createElementNS(ns, "svg");
svg.setAttribute("class", "road-layer");
svg.setAttribute("viewBox", `0 0 ${5 * TW} ${4 * VSTEP + TH}`);

const solid = document.createElementNS(ns, "polyline");
solid.setAttribute("class", "road-seg");
solid.setAttribute("points", chain.slice(0, 9).map(p => p.join(",")).join(" "));
svg.appendChild(solid);

const ghost = document.createElementNS(ns, "polyline");
ghost.setAttribute("class", "road-seg ghost");
ghost.setAttribute("points", chain.slice(8).map(p => p.join(",")).join(" "));
svg.appendChild(ghost);

TIMELINE.forEach((m, i) => {
  const [x, y] = chain[i * 2];
  const g = document.createElementNS(ns, "g");
  g.setAttribute("class", "node-btn");
  g.setAttribute("tabindex", "0");
  g.setAttribute("role", "button");
  g.setAttribute("aria-label", `${m.title}, ${m.dates}`);

  const hit = document.createElementNS(ns, "circle");
  hit.setAttribute("cx", x); hit.setAttribute("cy", y); hit.setAttribute("r", 16);
  hit.setAttribute("fill", "transparent");
  g.appendChild(hit);

  const w = m.piece === "city" ? 44 : 34;
  const src = m.piece === "ghost" ? "pieces/road-ghost.svg" : `pieces/${m.piece}.svg`;
  if (m.piece === "ghost") {
    const c = document.createElementNS(ns, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 11);
    c.setAttribute("fill", "none"); c.setAttribute("stroke", "#C0462B");
    c.setAttribute("stroke-width", "3"); c.setAttribute("stroke-dasharray", "4 4");
    g.appendChild(c);
  } else {
    const img = document.createElementNS(ns, "image");
    img.setAttribute("href", src);
    img.setAttribute("x", x - w / 2); img.setAttribute("y", y - w / 2);
    img.setAttribute("width", w); img.setAttribute("height", w);
    g.appendChild(img);
  }

  const open = () => openMilestone(m);
  g.addEventListener("click", open);
  g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
  svg.appendChild(g);
});
board.appendChild(svg);

/* ------------------------------------------------------------ resource hand */
const hand = document.getElementById("hand");
["wood", "brick", "sheep", "wheat", "ore"].forEach(r => {
  hand.insertAdjacentHTML("beforeend", `<img src="cards/card-${r}.svg" alt="${r}">`);
});

/* ----------------------------------------------------------- mobile fallback */
const stack = document.getElementById("stack");
Object.values(TILES).forEach(t => {
  stack.insertAdjacentHTML("beforeend",
    `<button onclick="openTile('${t.id}')"><img src="tiles/${t.id}.svg" alt="">${t.title}</button>`);
});
TIMELINE.forEach(m => {
  stack.insertAdjacentHTML("beforeend",
    `<button onclick="openMilestoneById('${m.id}')"><img src="pieces/${m.piece === 'ghost' ? 'settlement' : m.piece}.svg" alt="">${m.title}</button>`);
});

/* ------------------------------------------------------------------- modals */
function show(iconSrc, title, html, hash) {
  document.getElementById("m-icon").src = iconSrc;
  document.getElementById("m-title").textContent = title;
  document.getElementById("m-body").innerHTML = html;
  if (hash) history.replaceState(null, "", "#" + hash);
  modal.showModal();
}
function openTile(id) {
  const c = CONTENT[id];
  if (!c) return;
  const icon = id === "contact" ? "pieces/port.svg" : `tiles/${id}.svg`;
  show(icon, c.title, c.body, id);
}
function openMilestone(m) {
  show(`pieces/${m.piece === "ghost" ? "settlement" : m.piece}.svg`, m.title,
       `<p><em>${m.dates}</em></p><p>${m.body}</p>`, m.id);
}
function openMilestoneById(id) { openMilestone(TIMELINE.find(m => m.id === id)); }

modal.addEventListener("close", () => history.replaceState(null, "", location.pathname));
if (location.hash) {
  const h = location.hash.slice(1);
  if (CONTENT[h]) openTile(h);
  else if (TIMELINE.some(m => m.id === h)) openMilestoneById(h);
}
</script>
</body>
</html>
