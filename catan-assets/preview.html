<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Asset sheet</title>
<style>
body{background:#F4EDE0;color:#2E2823;font-family:system-ui,sans-serif;margin:0;padding:32px}
h2{margin:34px 0 12px;font-weight:500}
.grid{display:flex;flex-wrap:wrap;gap:18px}
figure{margin:0;text-align:center;background:#fff;border:1px solid #d8cfbe;border-radius:8px;padding:10px}
figcaption{font-size:.72rem;margin-top:6px;opacity:.7}
img{display:block}
</style></head><body>
<h1>Catan portfolio — asset sheet</h1>
<h2>Content tiles</h2><div class="grid" id="a"></div>
<h2>Filler tiles</h2><div class="grid" id="b"></div>
<h2>Number tokens</h2><div class="grid" id="c"></div>
<h2>Pieces</h2><div class="grid" id="d"></div>
<h2>Cards</h2><div class="grid" id="e"></div>
<script>
const S={a:[["tiles",["education","resume","research","about-me","projects","skills","desert"],150]],
b:[["tiles",["filler-brick","filler-wheat","filler-wood","filler-sheep"],150]],
c:[["tokens",["token-2","token-3","token-4","token-5","token-6","token-8","token-9","token-10","token-11","token-12"],64]],
d:[["pieces",["settlement","city","road","road-ghost","robber","port"],80]],
e:[["cards",["card-brick","card-wheat","card-wood","card-sheep","card-ore","card-dev-back","bonus-longest-road","bonus-largest-army"],110]]};
for(const k in S)for(const [dir,names,h] of S[k])for(const n of names)
document.getElementById(k).insertAdjacentHTML("beforeend",
`<figure><img src="${dir}/${n}.svg" style="height:${h}px" alt="${n}"><figcaption>${dir}/${n}.svg</figcaption></figure>`);
</script></body></html>
